<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padelschema</title>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --accent-hover: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --tuesday-color: #3b82f6;
            --thursday-color: #f59e0b;
            --danger: #ef4444;
            --glow-color: rgba(52, 211, 153, 0.4);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            width: 100%; 
            max-width: 650px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }
        
        .app-header-bar, .top-bar, .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 18px -2px var(--glow-color), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .app-header-bar {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            text-align: center;
            padding: 14px;
        }
        
        .app-header-bar h1 {
            color: var(--accent);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
        }

        .top-bar { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding: 14px;
        }
        
        .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        
        .user-select-group { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: bold; width: 100%; }
        
        select, input[type="text"], textarea { 
            background: var(--bg-color); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px 12px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            outline: none; 
            width: 100%; 
        }
        
        select:focus, input[type="text"]:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5); 
        }
        
        select { font-weight: bold; cursor: pointer; width: 100%; }

        .online-users-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .online-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .online-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .online-tag {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .online-tag.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: bold;
            background: rgba(52, 211, 153, 0.08);
        }

        .online-dot-mini {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--text-muted);
            border-radius: 50%;
        }

        .online-tag.active .online-dot-mini {
            background-color: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            animation: pulse-green 2s infinite ease-in-out;
        }

        .sync-status { 
            font-size: 0.75rem; 
            color: var(--accent); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: 600; 
        }

        .live-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse-green 2s infinite ease-in-out;
        }

        @keyframes pulse-green {
            0% { opacity: 0.3; transform: scale(0.9); box-shadow: 0 0 2px var(--accent); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px var(--accent); }
            100% { opacity: 0.3; transform: scale(0.9); box-shadow: 0 0 2px var(--accent); }
        }

        .global-chat-alert-btn {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 18px -2px var(--glow-color), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .card { display: flex; flex-direction: column; gap: 12px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        h2 { 
            color: var(--accent); 
            font-size: 1.05rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4); 
        }

        .schedule-list { display: flex; flex-direction: column; gap: 10px; }
        .week-card { background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .week-title { font-weight: bold; font-size: 0.9rem; color: var(--text-muted); }

        .day-box { display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, 0.02); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.03); }
        .day-header-row { display: flex; justify-content: space-between; align-items: center; }
        .day-label { font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        .day-label.di, .day-date.di { color: var(--tuesday-color); }
        .day-label.do, .day-date.do { color: var(--thursday-color); }
        .day-date { font-weight: bold; font-size: 0.8rem; }

        .player-tags { display: flex; align-items: center; justify-content: space-between; gap: 3px; flex-wrap: nowrap; width: 100%; overflow: hidden; }
        .vs-divider { font-weight: bold; color: var(--accent); font-size: 0.7rem; padding: 0 2px; flex-shrink: 0; }
        .player-tag { display: inline-block; background: #334155; padding: 4px 6px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
        .player-tag.highlight { background: var(--accent); color: #0f172a; font-weight: 800; box-shadow: 0 0 10px rgba(52, 211, 153, 0.7); }
        .player-tag.sub { background: #ab47bc; color: white; }

        .replace-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
        .replace-btn:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: bold; box-shadow: 0 0 10px rgba(52, 211, 153, 0.6); }

        .absence-alert { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; display: flex; align-items: center; gap: 6px; margin-top: 2px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 100; padding: 16px; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 14px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 18px rgba(52, 211, 153, 0.3); }
        .team-group { background: var(--bg-color); padding: 12px; border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .team-title { font-size: 0.85rem; font-weight: bold; color: var(--accent); }
        .input-stack { display: flex; flex-direction: column; gap: 4px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-actions button { flex: 1; }
        .btn-cancel { background: var(--border); color: var(--text-main); box-shadow: none; }
        .btn-cancel:hover { background: #475569; color: white; }
        .btn-primary { background: var(--accent); color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header-bar">
        <h1>🎾 Padelschema 🎾</h1>
    </div>

    <div class="top-bar">
        <div class="top-row">
            <div class="user-select-group">
                <label for="currentUser">👤 Wie ben jij?</label>
                <select id="currentUser" onchange="changeUser()">
                    <option value="Marcel">Marcel</option>
                    <option value="Mark">Mark</option>
                    <option value="Ronald">Ronald</option>
                    <option value="Sander">Sander</option>
                    <option value="Dennis">Dennis</option>
                    <option value="Robert">Robert</option>
                </select>
            </div>
        </div>

        <div class="online-users-box">
            <div class="online-title">🟢 Nu online / actief</div>
            <div class="online-list" id="onlineUsersList"></div>
        </div>

        <div class="sync-status" id="syncStatus">
            <span class="live-dot"></span> Live verbonden met database
        </div>
    </div>

    <a href="chat.html" class="global-chat-alert-btn" id="globalChatAlertBtn">
        <span id="chatBtnText">💬 Team Chat bekijken</span>
    </a>

    <div class="card">
        <div class="card-header">
            <h2>🎾 Speelschema (Komende 6 Weken)</h2>
        </div>
        <div class="schedule-list" id="scheduleList">Laden van schema...</div>
    </div>
</div>

<div class="modal" id="replaceModal">
    <div class="modal-content">
        <h3 style="color: var(--accent); font-size: 1.1rem;">⚙️ Invaller / Teams Wijzigen (Alleen deze week)</h3>
        <p id="modalSubTitle" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        <div class="team-group">
            <div class="team-title">Team 1</div>
            <div class="input-stack">
                <label style="font-size: 0.75rem; color: var(--text-muted);">Speler 1:</label>
                <select id="p0Select" onchange="checkCustomInputs()"></select>
                <input type="text" id="p0Custom" placeholder="Naam invaller..." style="display:none; margin-top:4px;">
            </div>
            <div class="input-stack" style="margin-top: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted);">Speler 2 (Partner):</label>
                <select id="p1Select" onchange="checkCustomInputs()"></select>
                <input type="text" id="p1Custom" placeholder="Naam invaller..." style="display:none; margin-top:4px;">
            </div>
        </div>
        <div class="team-group">
            <div class="team-title">Team 2 (Tegenstanders)</div>
            <div class="input-stack">
                <label style="font-size: 0.75rem; color: var(--text-muted);">Tegenstander 1:</label>
                <select id="p2Select" onchange="checkCustomInputs()"></select>
                <input type="text" id="p2Custom" placeholder="Naam invaller..." style="display:none; margin-top:4px;">
            </div>
            <div class="input-stack" style="margin-top: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted);">Tegenstander 2:</label>
                <select id="p3Select" onchange="checkCustomInputs()"></select>
                <input type="text" id="p3Custom" placeholder="Naam invaller..." style="display:none; margin-top:4px;">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="confirmReplacement()">Opslaan</button>
            <button class="btn-primary btn-cancel" onclick="closeModal()">Annuleren</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://padel-team-6-default-rtdb.europe-west1.firebasedatabase.app"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const basePlayers = ["Marcel", "Mark", "Ronald", "Sander", "Dennis", "Robert"];
    let currentUser = localStorage.getItem('padel_currentUser_stable') || "Robert";
    document.getElementById("currentUser").value = currentUser;

    const sessionToken = 'sess_' + Math.random().toString(36).substring(2, 9);
    let customScheduleOverrides = {};
    let allStatuses = {};
    let absences = {};

    document.addEventListener('DOMContentLoaded', () => {
        setupOnlinePresence();

        db.ref('padelData/scheduleOverrides').on('value', (snapshot) => {
            customScheduleOverrides = snapshot.val() || {};
            renderSchedule();
        });

        db.ref('padelData/absence').on('value', (snapshot) => {
            absences = snapshot.val() || {};
            renderSchedule();
        });
    });

    function setupOnlinePresence() {
        const userOnlineRef = db.ref(`onlineUsers/${currentUser}_${sessionToken}`);
        userOnlineRef.set({ name: currentUser, timestamp: Date.now() });
        userOnlineRef.onDisconnect().remove();

        db.ref('onlineUsers').on('value', (snapshot) => {
            const container = document.getElementById("onlineUsersList");
            container.innerHTML = "";
            const val = snapshot.val() || {};

            let activeMap = {};
            Object.values(val).forEach(item => {
                if (item && item.name) activeMap[item.name] = true;
            });

            basePlayers.forEach(player => {
                const isOnline = !!activeMap[player];
                const isCurrent = player === currentUser;
                const tag = document.createElement("div");
                tag.className = `online-tag ${isOnline ? 'active' : ''}`;
                tag.innerHTML = `
                    <span class="online-dot-mini"></span>
                    <span>${player}${isCurrent ? ' (Jij)' : ''}</span>
                `;
                container.appendChild(tag);
            });
        });

        setInterval(() => {
            userOnlineRef.set({ name: currentUser, timestamp: Date.now() });
        }, 15000);
    }

    window.changeUser = function() {
        db.ref(`onlineUsers/${currentUser}_${sessionToken}`).remove();
        currentUser = document.getElementById("currentUser").value;
        localStorage.setItem("padel_currentUser_stable", currentUser);
        setupOnlinePresence();
        renderSchedule();
    }

    const defaultTemplate = [
        { dinsdag: ["Ronald", "Sander", "Dennis", "Marcel"], donderdag: ["Mark", "Robert", "Marcel", "Sander"] },
        { dinsdag: ["Marcel", "Mark", "Dennis", "Robert"], donderdag: ["Ronald", "Sander", "Mark", "Dennis"] },
        { dinsdag: ["Ronald", "Robert", "Marcel", "Sander"], donderdag: ["Mark", "Marcel", "Dennis", "Ronald"] },
        { dinsdag: ["Marcel", "Mark", "Ronald", "Sander"], donderdag: ["Dennis", "Robert", "Marcel", "Ronald"] },
        { dinsdag: ["Mark", "Dennis", "Sander", "Robert"], donderdag: ["Marcel", "Sander", "Ronald", "Dennis"] },
        { dinsdag: ["Sander", "Ronald", "Robert", "Mark"], donderdag: ["Marcel", "Dennis", "Mark", "Sander"] }
    ];

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    function formatDateDDMMYY(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = String(date.getFullYear()).slice(-2);
        return `${d}-${m}-${y}`;
    }

    function getActiveDisplayWeeks() {
        const baseStartDate = new Date(2026, 8, 7);
        let weeks = [];
        const today = new Date();
        today.setHours(0,0,0,0);

        const diffDays = Math.floor((today - baseStartDate) / (1000 * 60 * 60 * 24));
        let startIndex = Math.floor(diffDays / 7);
        if (startIndex < 0) startIndex = 0;

        for (let i = 0; i < 6; i++) {
            const absoluteIndex = startIndex + i;
            const templateIndex = absoluteIndex % 6;
            
            const tuesdayDate = new Date(baseStartDate);
            tuesdayDate.setDate(baseStartDate.getDate() + (absoluteIndex * 7));
            const thursdayDate = new Date(tuesdayDate);
            thursdayDate.setDate(thursdayDate.getDate() + 3);

            let dinsdagPlayers = [...defaultTemplate[templateIndex].dinsdag];
            let donderdagPlayers = [...defaultTemplate[templateIndex].donderdag];

            if (customScheduleOverrides[absoluteIndex]) {
                if (customScheduleOverrides[absoluteIndex].dinsdag) dinsdagPlayers = customScheduleOverrides[absoluteIndex].dinsdag;
                if (customScheduleOverrides[absoluteIndex].donderdag) donderdagPlayers = customScheduleOverrides[absoluteIndex].donderdag;
            }

            weeks.push({
                weekIndex: absoluteIndex,
                displayWeekNum: getWeekNumber(tuesdayDate),
                tuesdayDateStr: formatDateDDMMYY(tuesdayDate),
                thursdayDateStr: formatDateDDMMYY(thursdayDate),
                dinsdag: dinsdagPlayers,
                donderdag: donderdagPlayers
            });
        }
        return weeks;
    }

    function checkAbsence(player, weekIndex, day) {
        return !!absences[`${player}_${weekIndex}_${day}`];
    }

    function renderPlayersHtml(players) {
        return players.map((p, idx) => {
            const isMe = p === currentUser;
            const isSub = !basePlayers.includes(p);
            let chipClass = "player-tag";
            if (isMe) chipClass += " highlight";
            if (isSub) chipClass += " sub";

            let html = `<span class="${chipClass}">${p}</span>`;
            if (idx === 1) html += ` <span class="vs-divider">VS</span> `;
            return html;
        }).join('');
    }

    function renderSchedule() {
        const container = document.getElementById('scheduleList');
        if (!container) return;
        const weeks = getActiveDisplayWeeks();
        let html = '';

        weeks.forEach(w => {
            let diAlert = '';
            w.dinsdag.forEach(p => {
                if (checkAbsence(p, w.weekIndex, 'dinsdag')) {
                    diAlert = `<div class="absence-alert">⚠️ Let op: ${p} afwezig!</div>`;
                }
            });

            let doAlert = '';
            w.donderdag.forEach(p => {
                if (checkAbsence(p, w.weekIndex, 'donderdag')) {
                    doAlert = `<div class="absence-alert">⚠️ Let op: ${p} afwezig!</div>`;
                }
            });

            html += `
                <div class="week-card">
                    <div class="week-title">Week ${w.displayWeekNum}</div>
                    <div class="day-box">
                        <div class="day-header-row">
                            <span class="day-label di">Dinsdag</span>
                            <span class="day-date di">${w.tuesdayDateStr}</span>
                            <button class="replace-btn" onclick="openReplaceModal(${w.weekIndex}, 'dinsdag')">Wijzig</button>
                        </div>
                        <div class="player-tags">${renderPlayersHtml(w.dinsdag)}</div>
                    </div>
                    ${diAlert}
                    <div class="day-box" style="margin-top: 6px;">
                        <div class="day-header-row">
                            <span class="day-label do">Donderdag</span>
                            <span class="day-date do">${w.thursdayDateStr}</span>
                            <button class="replace-btn" onclick="openReplaceModal(${w.weekIndex}, 'donderdag')">Wijzig</button>
                        </div>
                        <div class="player-tags">${renderPlayersHtml(w.donderdag)}</div>
                    </div>
                    ${doAlert}
                </div>
            `;
        });
        container.innerHTML = html;
    }

    let currentEditingWeek = null;
    let currentEditingDay = null;

    window.openReplaceModal = function(weekIndex, day) {
        currentEditingWeek = weekIndex;
        currentEditingDay = day;
        const activeWeeks = getActiveDisplayWeeks();
        const wObj = activeWeeks.find(w => w.weekIndex === weekIndex);
        const players = wObj[day];

        document.getElementById("modalSubTitle").innerText = `Week ${wObj.displayWeekNum} - ${day === 'dinsdag' ? 'Dinsdag' : 'Donderdag'}`;

        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            
            let opts = `<option value="">-- Kies speler --</option>`;
            basePlayers.forEach(p => { opts += `<option value="${p}">${p}</option>`; });
            opts += `<option value="custom">-- Invaller (typ naam) --</option>`;
            select.innerHTML = opts;

            const pName = players[i] || "";
            if (basePlayers.includes(pName)) {
                select.value = pName;
                customInput.style.display = "none";
                customInput.value = "";
            } else if (pName) {
                select.value = "custom";
                customInput.style.display = "block";
                customInput.value = pName;
            } else {
                select.value = "";
                customInput.style.display = "none";
                customInput.value = "";
            }
        }
        document.getElementById("replaceModal").style.display = "flex";
    };

    window.checkCustomInputs = function() {
        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            if (select.value === "custom") {
                customInput.style.display = "block";
            } else {
                customInput.style.display = "none";
                customInput.value = "";
            }
        }
    };

    window.closeModal = function() {
        document.getElementById("replaceModal").style.display = "none";
    };

    window.confirmReplacement = function() {
        let newPlayers = [];
        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            let val = select.value === "custom" ? customInput.value.trim() : select.value;
            if (!val) val = basePlayers[i];
            newPlayers.push(val);
        }
        db.ref(`padelData/scheduleOverrides/${currentEditingWeek}/${currentEditingDay}`).set(newPlayers);
        closeModal();
    };
</script>

</body>
</html>
