<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padelschema - Rooster, Chat & Afwezigheid</title>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --card-border-glow: #374151;
            --btn-bg: #263345;
            --btn-hover: #32445c;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-orange: #fb923c;
            --accent-green: #34d399;
            --accent-green-bg: rgba(52, 211, 153, 0.1);
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --main-glow: 0 16px 60px rgba(52, 211, 153, 0.28), 0 0 50px rgba(52, 211, 153, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: var(--main-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            text-align: center;
        }

        .live-clock-badge {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-align: center;
        }

        .live-clock-badge .week-highlight {
            color: var(--accent-orange);
            font-weight: 700;
        }

        .live-clock-badge strong {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .user-select-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
        }

        .user-select-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        .user-select-container select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .status-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            background: var(--bg-color);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Navigatie tabs / knoppen tussen rooster, afwezigheid en chat */
        .nav-tabs {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .nav-tab {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: var(--btn-bg);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .app-section {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .app-section.active {
            display: flex;
        }

        .week-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .week-header {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--card-border);
        }

        .match-row {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-row:last-child {
            border-bottom: none;
        }

        .match-info {
            flex-grow: 1;
        }

        .match-title {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .players-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .player-chip {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .player-chip.me {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: var(--accent-green-bg);
        }

        .vs-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 2px;
        }

        .btn-edit {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-edit:hover {
            background-color: var(--btn-hover);
        }

        /* Chat sectie styling */
        .chat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: 450px;
            overflow: hidden;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
        }

        .chat-msg.mine {
            align-self: flex-end;
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-blue);
        }

        .chat-msg-header {
            font-size: 0.75rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: rgba(255, 255, 255, 0.01);
            border-top: 1px solid var(--card-border);
            gap: 8px;
        }

        .chat-input-area input {
            flex-grow: 1;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area button {
            background: var(--accent-green);
            color: #0b0f19;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Afwezigheid styling */
        .absence-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .absence-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .absence-item {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            color: var(--accent-green);
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .player-select-group {
            margin-bottom: 12px;
        }

        .player-select-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .player-select-group select, .player-select-group input {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: var(--accent-green);
            color: #0b0f19;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Padelschema</h1>
        
        <div id="liveClock" class="live-clock-badge">Laden...</div>

        <div class="user-select-row">
            <div class="user-select-container">
                <label for="userSelect">Jij:</label>
                <select id="userSelect" onchange="changeUser()">
                    <!-- Dynamisch gevuld -->
                </select>
            </div>
            
            <div style="font-size: 0.8rem; color: var(--accent-green); display: flex; align-items: center; gap: 6px;">
                <span class="status-dot online"></span>
                <span>Live verbonden</span>
            </div>
        </div>

        <div id="statusList" class="status-container">
            Laden status...
        </div>
    </header>

    <!-- Navigatie knoppen -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('schedule')">📅 Speelschema</button>
        <button class="nav-tab" onclick="switchTab('absence')">🏖️ Afwezigheid</button>
        <button class="nav-tab" onclick="switchTab('chat')">💬 Team Chat</button>
    </div>

    <!-- SECTIE 1: SPEELSCHEMA -->
    <div id="section-schedule" class="app-section active">
        <div class="section-title">📅 Speelschema (komende 6 weken)</div>
        <div id="scheduleContainer" style="display: flex; flex-direction: column; gap: 16px;">Laden van schema...</div>
    </div>

    <!-- SECTIE 2: AFWEZIGHEID -->
    <div id="section-absence" class="app-section">
        <div class="section-title">🏖️ Afwezigheid melden & beheren</div>
        <div class="absence-card">
            <div class="player-select-group">
                <label>Wie is er afwezig / op vakantie?</label>
                <select id="absentPlayerSelect">
                    <!-- Dynamisch gevuld -->
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="player-select-group" style="flex: 1;">
                    <label>Vanaf datum</label>
                    <input type="date" id="absentStart">
                </div>
                <div class="player-select-group" style="flex: 1;">
                    <label>Tot en met datum</label>
                    <input type="date" id="absentEnd">
                </div>
            </div>
            <button class="btn-save" onclick="addAbsence()">Afwezigheid opslaan</button>
        </div>

        <div class="section-title">📋 Overzicht afwezigheden</div>
        <div id="absenceContainer" class="absence-list">
            Geen afwezigheden gemeld.
        </div>
    </div>

    <!-- SECTIE 3: CHAT -->
    <div id="section-chat" class="app-section">
        <div class="section-title">💬 Team Chat</div>
        <div class="chat-card">
            <div id="chatMessages" class="chat-messages">
                Berichten laden...
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Typ een bericht..." onkeypress="checkChatEnter(event)">
                <button onclick="sendChatMessage()">Verstuur</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal voor wijzigen schema -->
<div id="replaceModal" class="modal">
    <div class="modal-content">
        <h3 id="modalSubTitle">Spelers wijzigen</h3>
        
        <div class="player-select-group">
            <label>Speler 1</label>
            <select id="p0Select" onchange="checkCustomInputs()"></select>
            <input type="text" id="p0Custom" placeholder="Naam invaller" style="display:none; margin-top:4px;">
        </div>
        <div class="player-select-group">
            <label>Speler 2</label>
            <select id="p1Select" onchange="checkCustomInputs()"></select>
            <input type="text" id="p1Custom" placeholder="Naam invaller" style="display:none; margin-top:4px;">
        </div>
        <div class="player-select-group">
            <label>Speler 3</label>
            <select id="p2Select" onchange="checkCustomInputs()"></select>
            <input type="text" id="p2Custom" placeholder="Naam invaller" style="display:none; margin-top:4px;">
        </div>
        <div class="player-select-group">
            <label>Speler 4</label>
            <select id="p3Select" onchange="checkCustomInputs()"></select>
            <input type="text" id="p3Custom" placeholder="Naam invaller" style="display:none; margin-top:4px;">
        </div>

        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Annuleren</button>
            <button class="btn-save" onclick="confirmReplacement()">Opslaan</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://padelschema-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const basePlayers = ["Marcel", "Mark", "Ronald", "Sander", "Dennis", "Robert"];
    let currentUserName = localStorage.getItem('padel_current_user') || "Robert";

    const defaultTemplate = [
        { dinsdag: ["Ronald", "Sander", "Dennis", "Marcel"], donderdag: ["Mark", "Robert", "Marcel", "Sander"] },
        { dinsdag: ["Marcel", "Mark", "Dennis", "Robert"], donderdag: ["Ronald", "Sander", "Mark", "Dennis"] },
        { dinsdag: ["Ronald", "Robert", "Marcel", "Sander"], donderdag: ["Mark", "Marcel", "Dennis", "Ronald"] },
        { dinsdag: ["Marcel", "Mark", "Ronald", "Sander"], donderdag: ["Dennis", "Robert", "Marcel", "Ronald"] },
        { dinsdag: ["Mark", "Dennis", "Sander", "Robert"], donderdag: ["Marcel", "Sander", "Ronald", "Dennis"] },
        { dinsdag: ["Sander", "Ronald", "Robert", "Mark"], donderdag: ["Marcel", "Dennis", "Mark", "Sander"] }
    ];

    let liveOverrides = {};
    let allStatuses = {};
    let chatMessages = {};
    let absences = {};

    document.addEventListener('DOMContentLoaded', () => {
        initUserSelect();
        updateLiveClock();
        setInterval(updateLiveClock, 1000);

        db.ref('scheduleOverrides').on('value', (snapshot) => {
            liveOverrides = snapshot.val() || {};
            renderSchedule();
        });

        db.ref('status').on('value', (snapshot) => {
            allStatuses = snapshot.val() || {};
            renderStatuses();
        });

        db.ref('chat').on('value', (snapshot) => {
            chatMessages = snapshot.val() || {};
            renderChat();
        });

        db.ref('absences').on('value', (snapshot) => {
            absences = snapshot.val() || {};
            renderAbsences();
        });

        setupOnlinePresence();
    });

    function switchTab(tabName) {
        document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        
        document.getElementById(`section-${tabName}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function updateLiveClock() {
        const now = new Date();
        const optionsDate = { weekday: 'short', day: 'numeric', month: 'short' };
        const dateStr = now.toLocaleDateString('nl-NL', optionsDate);
        const timeStr = now.toLocaleTimeString('nl-NL');
        const weekNum = getWeekNumber(now);

        const clockHtml = `
            <span><span class="week-highlight">Week ${weekNum}</span> | <strong>${dateStr}</strong></span>
            <span>•</span>
            <strong>${timeStr}</strong>
        `;
        
        const clockEl = document.getElementById('liveClock');
        if (clockEl) clockEl.innerHTML = clockHtml;
    }

    function initUserSelect() {
        const select = document.getElementById('userSelect');
        select.innerHTML = basePlayers.map(p => `<option value="${p}" ${p === currentUserName ? 'selected' : ''}>${p}</option>`).join('');
        
        const absentSelect = document.getElementById('absentPlayerSelect');
        if (absentSelect) {
            absentSelect.innerHTML = basePlayers.map(p => `<option value="${p}" ${p === currentUserName ? 'selected' : ''}>${p}</option>`).join('');
        }
    }

    function changeUser() {
        const select = document.getElementById('userSelect');
        currentUserName = select.value;
        localStorage.setItem('padel_current_user', currentUserName);
        setupOnlinePresence();
        renderStatuses();
        renderSchedule();
        renderChat();
    }

    function setupOnlinePresence() {
        const userStatusRef = db.ref(`status/${currentUserName}`);
        const isOffline = { state: "offline", lastChanged: firebase.database.ServerValue.TIMESTAMP };
        const isOnline = { state: "online", lastChanged: firebase.database.ServerValue.TIMESTAMP };

        db.ref('.info/connected').on('value', (snapshot) => {
            if (snapshot.val() === false) return;
            userStatusRef.onDisconnect().set(isOffline).then(() => {
                userStatusRef.set(isOnline);
            });
        });
    }

    function formatLastSeen(lastChanged) {
        if (!lastChanged) return "Offline";
        const diffMs = Date.now() - lastChanged;
        const diffMins = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        if (diffMins < 2) return "online";
        if (diffMins < 60) return `${diffMins}u geleden`;
        if (diffHours < 24) return `${diffHours}d geleden`;
        return `${diffDays}d geleden`;
    }

    function renderStatuses() {
        const container = document.getElementById('statusList');
        if (!container) return;
        let html = '';

        basePlayers.forEach(player => {
            const statusData = allStatuses[player];
            const isOnline = statusData && statusData.state === "online" && (Date.now() - statusData.lastChanged < 120000);
            const statusText = isOnline ? "online" : formatLastSeen(statusData ? statusData.lastChanged : null);
            const dotClass = isOnline ? "online" : "";

            html += `
                <div class="status-badge">
                    <span class="status-dot ${dotClass}"></span>
                    <span>${player} (${statusText})</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    const berekenHuidigeCyclusWeek = () => {
        const startDatum = new Date('2026-09-07T00:00:00');
        const nu = new Date();
        const verschilInMs = nu - startDatum;
        if (verschilInMs < 0) return 0;

        const extraOffsetMs = 1000 * 60 * 60 * 24 * 3;
        const aangepastVerschil = verschilInMs + extraOffsetMs;
        const verschilInWeken = Math.floor(aangepastVerschil / (1000 * 60 * 60 * 24 * 7));
        return verschilInWeken % 6;
    };

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    function formatDateDDMMYY(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = String(date.getFullYear()).slice(-2);
        return `${d}-${m}-${y}`;
    }

    function getActiveDisplayWeeks() {
        const startBaseDate = new Date(2026, 8, 7);
        let weeks = [];
        let startIndex = berekenHuidigeCyclusWeek();

        for (let i = 0; i < 6; i++) {
            const currentCycleIndex = (startIndex + i) % defaultTemplate.length;
            const weekIndex = currentCycleIndex + 1;
            
            const diDate = new Date(startBaseDate);
            diDate.setDate(startBaseDate.getDate() + ((startIndex + i) * 7));
            const doDate = new Date(diDate);
            doDate.setDate(diDate.getDate() + 3);

            const currentTemplateWeek = defaultTemplate[currentCycleIndex];
            let dinsdagPlayers = [...currentTemplateWeek.dinsdag];
            let donderdagPlayers = [...currentTemplateWeek.donderdag];

            if (liveOverrides[weekIndex]) {
                if (liveOverrides[weekIndex].dinsdag) dinsdagPlayers = liveOverrides[weekIndex].dinsdag;
                if (liveOverrides[weekIndex].donderdag) donderdagPlayers = liveOverrides[weekIndex].donderdag;
            }

            weeks.push({
                weekIndex,
                weekNumber: getWeekNumber(diDate),
                dinsdagDateStr: formatDateDDMMYY(diDate),
                donderdagDateStr: formatDateDDMMYY(doDate),
                dinsdag: dinsdagPlayers,
                donderdag: donderdagPlayers
            });
        }
        return weeks;
    }

    function renderPlayersHtml(players) {
        return players.map((p, idx) => {
            const isMe = p === currentUserName;
            const chipClass = isMe ? "player-chip me" : "player-chip";
            let html = `<span class="${chipClass}">${p}</span>`;
            if (idx === 1) html += ` <span class="vs-text">VS</span> `;
            else if (idx < 3) html += ` `;
            return html;
        }).join('');
    }

    function renderSchedule() {
        const container = document.getElementById('scheduleContainer');
        if (!container) return;
        const weeks = getActiveDisplayWeeks();
        let html = '';

        weeks.forEach(w => {
            html += `
                <div class="week-card">
                    <div class="week-header">
                        Week ${w.weekNumber}
                    </div>
                    <div class="match-row">
                        <div class="match-info">
                            <div class="match-title">Dinsdag ${w.dinsdagDateStr}</div>
                            <div class="players-container">${renderPlayersHtml(w.dinsdag)}</div>
                        </div>
                        <button class="btn-edit" onclick="openReplaceModal(${w.weekIndex}, 'dinsdag')">Wijzig</button>
                    </div>
                    <div class="match-row">
                        <div class="match-info">
                            <div class="match-title">Donderdag ${w.donderdagDateStr}</div>
                            <div class="players-container">${renderPlayersHtml(w.donderdag)}</div>
                        </div>
                        <button class="btn-edit" onclick="openReplaceModal(${w.weekIndex}, 'donderdag')">Wijzig</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // CHAT FUNCTIES
    function renderChat() {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        let html = '';

        const keys = Object.keys(chatMessages).sort((a,b) => a - b);
        if (keys.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Nog geen berichten in de chat. Stuur er eentje!</div>';
            return;
        }

        keys.forEach(k => {
            const msg = chatMessages[k];
            const isMine = msg.sender === currentUserName;
            const msgClass = isMine ? "chat-msg mine" : "chat-msg";

            html += `
                <div class="${msgClass}">
                    <div class="chat-msg-header">${msg.sender} • ${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    <div>${msg.text}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        db.ref('chat').push({
            sender: currentUserName,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        input.value = '';
    }

    function checkChatEnter(e) {
        if (e.key === 'Enter') sendChatMessage();
    }

    // AFWEZIGHEID FUNCTIES
    function addAbsence() {
        const player = document.getElementById('absentPlayerSelect').value;
        const start = document.getElementById('absentStart').value;
        const end = document.getElementById('absentEnd').value;

        if (!start || !end) {
            alert('Kies alstublieft een start- en einddatum.');
            return;
        }

        db.ref('absences').push({
            player, start, end
        });

        document.getElementById('absentStart').value = '';
        document.getElementById('absentEnd').value = '';
    }

    function removeAbsence(key) {
        db.ref(`absences/${key}`).remove();
    }

    function renderAbsences() {
        const container = document.getElementById('absenceContainer');
        if (!container) return;
        let html = '';

        const keys = Object.keys(absences);
        if (keys.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); font-size:0.9rem;">Geen afwezigheden gemeld.</div>';
            return;
        }

        keys.forEach(k => {
            const item = absences[k];
            html += `
                <div class="absence-item">
                    <div><strong>${item.player}</strong>: ${item.start} t/m ${item.end}</div>
                    <button class="btn-danger" onclick="removeAbsence('${k}')">Verwijder</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    let currentEditingWeek = null;
    let currentEditingDay = null;

    window.openReplaceModal = function(weekIndex, day) {
        currentEditingWeek = weekIndex;
        currentEditingDay = day;
        document.getElementById("modalSubTitle").innerText = `Cyclus Week ${weekIndex} - ${day === 'dinsdag' ? 'Dinsdag' : 'Donderdag'}`;
        
        const activeWeeks = getActiveDisplayWeeks();
        const currentWeekData = activeWeeks.find(w => w.weekIndex === weekIndex);
        const currentPlayers = day === 'dinsdag' ? currentWeekData.dinsdag : currentWeekData.donderdag;

        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            
            let optionsHtml = `<option value="">-- Kies speler --</option>`;
            basePlayers.forEach(p => { optionsHtml += `<option value="${p}">${p}</option>`; });
            optionsHtml += `<option value="custom">-- Invaller (typ naam) --</option>`;
            select.innerHTML = optionsHtml;

            const assignedPlayer = currentPlayers[i] || "";
            if (basePlayers.includes(assignedPlayer)) {
                select.value = assignedPlayer;
                customInput.style.display = "none";
                customInput.value = "";
            } else if (assignedPlayer) {
                select.value = "custom";
                customInput.style.display = "block";
                customInput.value = assignedPlayer;
            } else {
                select.value = "";
                customInput.style.display = "none";
                customInput.value = "";
            }
        }
        document.getElementById("replaceModal").style.display = "flex";
    };

    window.checkCustomInputs = function() {
        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            if (select.value === "custom") {
                customInput.style.display = "block";
            } else {
                customInput.style.display = "none";
                customInput.value = "";
            }
        }
    };

    window.closeModal = function() {
        document.getElementById("replaceModal").style.display = "none";
    };

    window.confirmReplacement = async function() {
        let newPlayers = [];
        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`p${i}Select`);
            const customInput = document.getElementById(`p${i}Custom`);
            let val = select.value === "custom" ? customInput.value.trim() : select.value;
            if (!val) val = basePlayers[i];
            newPlayers.push(val);
        }
        await db.ref(`scheduleOverrides/${currentEditingWeek}/${currentEditingDay}`).set(newPlayers);
        closeModal();
    };
</script>

</body>
</html>
